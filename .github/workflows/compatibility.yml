name: Studio compatibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      check_production_release:
        description: Check production gates without publishing or deploying
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: python tools/verify_repository.py
      - run: python tools/test_engine.py
      - run: python tools/test_android_policy.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:blueprints
      - run: python tools/build_installer.py
      - run: python tools/verify_repository.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-acceptance
          path: |
            evidence/
            dist/
          retention-days: 14
  core-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ['2026.9.4', '2026.10.2', '2026.10.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/src:ro" -w /src --entrypoint python ghcr.io/home-assistant/home-assistant:${{ matrix.core }} tools/ha_contract.py
      - run: docker run --rm -v "$PWD:/src:ro" -w /src --entrypoint python ghcr.io/home-assistant/home-assistant:${{ matrix.core }} tools/ha_script_contract.py
  release:
    needs: [product, core-contract]
    if: github.event_name == 'workflow_dispatch' && inputs.check_production_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: product-acceptance
      - run: python tools/check_release.py
