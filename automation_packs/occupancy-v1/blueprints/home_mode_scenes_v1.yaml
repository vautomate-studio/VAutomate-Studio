blueprint:
  name: "VAutomate · Home mode scenes · v1"
  description: >-
    Activate a selected scene when a persistent mode helper turns on. Optionally choose scenes for turning it off.
    Select the exact scenes to use; this does not infer or restore previous states. Mode changes start only on a real off/on transition.
    Review effects on everyone at home. Lab draft; customer creation binding and testing are pending.
  domain: automation
  author: VAutomate
  input:
    mode_helper:
      name: Dawat, Cinema, Sleep or another mode helper
      selector:
        entity:
          filter:
            domain: input_boolean
    on_scene:
      name: Scene to apply when this mode turns on
      selector:
        entity:
          filter:
            domain: scene
    off_scenes:
      name: Scenes to apply when this mode turns off · optional
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: scene
triggers:
  - trigger: state
    entity_id: !input mode_helper
    from: "off"
    to: "on"
    id: enabled
  - trigger: state
    entity_id: !input mode_helper
    from: "on"
    to: "off"
    id: disabled
variables:
  off_choices: !input off_scenes
actions:
  - choose:
      - conditions: "{{ trigger.id == 'enabled' }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input on_scene
      - conditions: "{{ trigger.id == 'disabled' and off_choices | count > 0 }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input off_scenes
mode: restart
max_exceeded: silent
